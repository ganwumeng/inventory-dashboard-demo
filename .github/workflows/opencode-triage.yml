name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Deviation from the official example (disclosed): the 30-day
      # account-age gate is removed -- the test accounts are new.
      - uses: actions/checkout@v6
        with:
          # use_github_token mode: persist the runner token so the agent's
          # git operations authenticate (the App flow carries its own).
          persist-credentials: true

      - name: Configure git identity
        # Required in use_github_token mode: the action asserts a git
        # author identity (normally provided by the OpenCode App flow).
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: openrouter/openai/gpt-5.6-luna
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
